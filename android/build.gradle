buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"

        // ⚠️ IMPORTANT: Use stable Kotlin (NOT 2.0.x)
        kotlinVersion = "1.9.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //  Explicit versions (VERY IMPORTANT)
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("com.facebook.react:react-native-gradle-plugin:0.9.11")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

subprojects {
    repositories {
        google()
        mavenCentral()
    }

    //  FIX: Force compatible AndroidX versions (prevents SDK 36 error)
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.12.0"
            force "androidx.core:core-ktx:1.12.0"
        }
    }
}

//  Required for RN 0.79+
apply plugin: "com.facebook.react.rootproject"